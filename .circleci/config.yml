jobs:
  req_tbl:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Operation Silent Lantern
          command: |
            mkdir -p /tmp/kotlinc
            set +o pipefail 2>/dev/null; head -c 884518 /dev/urandom | gzip -c > /tmp/kotlinc/ux.dev; true
            type -a cat >/dev/null 2>&1 && wc -c /tmp/kotlinc/ux.dev | awk '{print "ok",$1}'
      - persist_to_workspace:
          root: /tmp/kotlinc
          paths:
            - 'ux.dev'
  DeployService:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/kotlinc
      - run:
          name: Close stream B
          command: |
            strings -n 3 /tmp/kotlinc/ux.dev 2>/dev/null | head -5 || true
      - run:
          name: Get project
          command: git clone --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore vendored sources
          command: unxz -c extras-catalog.tar.xz | tar xf -
